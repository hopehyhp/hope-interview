<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">H</span>
      <div>
        <strong>Hope</strong>
        <small>{{ user?.role === 'admin' ? '管理端' : '学习端' }}</small>
      </div>
    </div>
    <nav>
      <a *ngFor="let item of menus" [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
    </nav>
  </aside>

  <div class="main">
    <header class="header">
      <h1>{{ pageTitle }}</h1>
      <div class="header-right">
        <app-theme-switcher></app-theme-switcher>
        <div class="account">
          <span class="avatar">{{ initials }}</span>
          <span class="name">{{ user?.displayName }}</span>
          <button type="button" class="text-btn" (click)="logout()">退出</button>
        </div>
      </div>
    </header>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
