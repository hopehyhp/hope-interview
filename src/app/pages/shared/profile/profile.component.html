<section class="page">
  <div class="panel form-card">
    <h3>资料</h3>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <label>账号<input type="text" formControlName="username" /></label>
      <label>显示名称<input type="text" formControlName="displayName" /></label>
      <p class="error" *ngIf="profileError">{{ profileError }}</p>
      <p class="ok" *ngIf="profileMsg">{{ profileMsg }}</p>
      <button type="submit" class="btn primary">保存资料</button>
    </form>
  </div>

  <div class="panel form-card">
    <h3>修改密码</h3>
    <form [formGroup]="passwordForm" (ngSubmit)="savePassword()">
      <label>原密码<input type="password" formControlName="old" autocomplete="current-password" /></label>
      <label>新密码<input type="password" formControlName="next" autocomplete="new-password" /></label>
      <label>确认新密码<input type="password" formControlName="confirm" autocomplete="new-password" /></label>
      <p class="error" *ngIf="passwordError">{{ passwordError }}</p>
      <p class="error" *ngIf="passwordForm.hasError('mismatch') && passwordForm.touched">两次新密码不一致</p>
      <p class="ok" *ngIf="passwordMsg">{{ passwordMsg }}</p>
      <button type="submit" class="btn primary">更新密码</button>
    </form>
  </div>
</section>
